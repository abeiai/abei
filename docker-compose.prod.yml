name: ${COMPOSE_PROJECT_NAME:-xueleai-prod}

services:
  runtime-permissions:
    image: alpine:3.20
    restart: "no"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - sh
      - -c
      - |
        mkdir -p /runtime/logs/api-core /runtime/uploads
        chown -R 1000:1000 /runtime/logs/api-core /runtime/uploads
        chmod -R u+rwX,g+rwX /runtime/logs/api-core /runtime/uploads
    volumes:
      - ./deploy/data/logs/api-core:/runtime/logs/api-core
      - ./deploy/data/uploads:/runtime/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      runtime-permissions:
        condition: service_completed_successfully
      web:
        condition: service_healthy
      api-core:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-3320}:3320"
      - "${NGINX_HTTPS_PORT:-3326}:3326"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/data/certbot:/var/www/certbot:ro
      - ./deploy/data/logs/nginx:/var/log/nginx
      - ./deploy/data/uploads:/var/www/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3320/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${WEB_IMAGE:-xueleai-web:0.0.0}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      PORT: "3321"
      HOSTNAME: 0.0.0.0
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
      API_BASE_URL: ${DOCKER_API_BASE_URL:-http://api-core:3322/api}
    depends_on:
      api-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  api-core:
    image: ${API_CORE_IMAGE:-xueleai-api-core:0.0.0}
    build:
      context: .
      dockerfile: apps/api-core/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
      API_CORE_PORT: "3322"
      API_BODY_LIMIT: ${API_BODY_LIMIT:-12mb}
      APP_BASE_URL: ${APP_BASE_URL:-https://xueleai.com}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://xueleai:change_this_postgres_password@postgres:3327/xueleai?schema=public}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:3328}
      AI_GATEWAY_BASE_URL: ${DOCKER_AI_GATEWAY_BASE_URL:-http://ai-gateway:3323}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      PROFILE_CONTEXT_SECRET: ${PROFILE_CONTEXT_SECRET:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-400d}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_LOGIN_MAX: ${RATE_LIMIT_AUTH_LOGIN_MAX:-10}
      RATE_LIMIT_AUTH_LEARNER_LOGIN_MAX: ${RATE_LIMIT_AUTH_LEARNER_LOGIN_MAX:-10}
      RATE_LIMIT_AUTH_REGISTER_MAX: ${RATE_LIMIT_AUTH_REGISTER_MAX:-5}
      RATE_LIMIT_AUTH_EMAIL_CODE_MAX: ${RATE_LIMIT_AUTH_EMAIL_CODE_MAX:-5}
      RATE_LIMIT_AUTH_EMAIL_CODE_SUBJECT_MAX: ${RATE_LIMIT_AUTH_EMAIL_CODE_SUBJECT_MAX:-3}
      RATE_LIMIT_AUTH_RESET_PASSWORD_MAX: ${RATE_LIMIT_AUTH_RESET_PASSWORD_MAX:-5}
      RATE_LIMIT_AUTH_RESET_PASSWORD_SUBJECT_MAX: ${RATE_LIMIT_AUTH_RESET_PASSWORD_SUBJECT_MAX:-5}
      RATE_LIMIT_AUTH_WECHAT_MAX: ${RATE_LIMIT_AUTH_WECHAT_MAX:-20}
      RATE_LIMIT_ADMIN_AUTH_LOGIN_MAX: ${RATE_LIMIT_ADMIN_AUTH_LOGIN_MAX:-10}
      RATE_LIMIT_PROFILE_SWITCH_MAX: ${RATE_LIMIT_PROFILE_SWITCH_MAX:-20}
      RATE_LIMIT_PROFILE_RETURN_ACCOUNT_MAX: ${RATE_LIMIT_PROFILE_RETURN_ACCOUNT_MAX:-20}
      RATE_LIMIT_PAYMENT_ORDERS_MAX: ${RATE_LIMIT_PAYMENT_ORDERS_MAX:-20}
      RATE_LIMIT_PAYMENT_ORDER_SYNC_MAX: ${RATE_LIMIT_PAYMENT_ORDER_SYNC_MAX:-30}
      RATE_LIMIT_AI_TASKS_MAX: ${RATE_LIMIT_AI_TASKS_MAX:-20}
      LOGIN_FAILURE_MAX_ATTEMPTS: ${LOGIN_FAILURE_MAX_ATTEMPTS:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_FAILURE_LOCK_SECONDS: ${LOGIN_FAILURE_LOCK_SECONDS:-900}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_ENV: ${ALIPAY_ENV:-production}
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_GATEWAY_URL: ${WECHAT_PAY_GATEWAY_URL:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:-}
      WECHAT_PAY_PLATFORM_SERIAL_NO: ${WECHAT_PAY_PLATFORM_SERIAL_NO:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_OPEN_APP_ID: ${WECHAT_OPEN_APP_ID:-}
      WECHAT_OPEN_APP_SECRET: ${WECHAT_OPEN_APP_SECRET:-}
      ENABLE_MOCK_PAYMENT_NOTIFY: ${ENABLE_MOCK_PAYMENT_NOTIFY:-}
      AI_GATEWAY_TIMEOUT_MS: ${AI_GATEWAY_TIMEOUT_MS:-120000}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_MODEL_DISPLAY_NAME: ${AI_PROVIDER_MODEL_DISPLAY_NAME:-}
      AI_PROVIDER_MODEL_NAME: ${AI_PROVIDER_MODEL_NAME:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      MINIMAX_H3S_API_KEY: ${MINIMAX_H3S_API_KEY:-}
      AI_PROVIDER_INPUT_PRICE: ${AI_PROVIDER_INPUT_PRICE:-1}
      AI_PROVIDER_OUTPUT_PRICE: ${AI_PROVIDER_OUTPUT_PRICE:-4}
      AI_PROVIDER_TEMPERATURE: ${AI_PROVIDER_TEMPERATURE:-0.7}
      AI_PROVIDER_MAX_TOKENS: ${AI_PROVIDER_MAX_TOKENS:-16000}
      AI_TEXT_MAX_OUTPUT_CHARS: ${AI_TEXT_MAX_OUTPUT_CHARS:-128000}
      PUBLIC_API_BASE_URL: ${DOCKER_PUBLIC_API_BASE_URL:-/api}
      UPLOAD_DRIVER: ${UPLOAD_DRIVER:-local}
      MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-524288000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-1}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-uploads/}
      TEXTBOOK_CDN_BASE_URL: ${TEXTBOOK_CDN_BASE_URL:-https://cdn.xueleai.com}
      VIDEO_GUIDE_MEDIA_UPLOAD_DRIVER: ${VIDEO_GUIDE_MEDIA_UPLOAD_DRIVER:-r2}
      VIDEO_GUIDE_R2_ENDPOINT: ${VIDEO_GUIDE_R2_ENDPOINT:-${S3_ENDPOINT:-}}
      VIDEO_GUIDE_R2_BUCKET: ${VIDEO_GUIDE_R2_BUCKET:-xueleai}
      VIDEO_GUIDE_R2_REGION: ${VIDEO_GUIDE_R2_REGION:-${S3_REGION:-auto}}
      VIDEO_GUIDE_R2_ACCESS_KEY_ID: ${VIDEO_GUIDE_R2_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
      VIDEO_GUIDE_R2_SECRET_ACCESS_KEY: ${VIDEO_GUIDE_R2_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
      VIDEO_GUIDE_R2_FORCE_PATH_STYLE: ${VIDEO_GUIDE_R2_FORCE_PATH_STYLE:-${S3_FORCE_PATH_STYLE:-1}}
      VIDEO_GUIDE_R2_MEDIA_PREFIX: ${VIDEO_GUIDE_R2_MEDIA_PREFIX:-video-guide/media/}
      VIDEO_GUIDE_R2_NARRATION_PREFIX: ${VIDEO_GUIDE_R2_NARRATION_PREFIX:-video-guide/narration/}
      VIDEO_GUIDE_R2_PUBLIC_BASE_URL: ${VIDEO_GUIDE_R2_PUBLIC_BASE_URL:-https://cdn.xueleai.com}
      VIDEO_GUIDE_NARRATION_AUDIO_MAX_BYTES: ${VIDEO_GUIDE_NARRATION_AUDIO_MAX_BYTES:-26214400}
      VIDEO_GUIDE_NARRATION_TTS_RPS: ${VIDEO_GUIDE_NARRATION_TTS_RPS:-0.75}
      VIDEO_GUIDE_NARRATION_TTS_REDIS_TIMEOUT_MS: ${VIDEO_GUIDE_NARRATION_TTS_REDIS_TIMEOUT_MS:-5000}
      VIDEO_GUIDE_R2_REQUEST_TIMEOUT_MS: ${VIDEO_GUIDE_R2_REQUEST_TIMEOUT_MS:-30000}
      VIDEO_GUIDE_TTS_DOWNLOAD_ALLOWED_HOSTS: ${VIDEO_GUIDE_TTS_DOWNLOAD_ALLOWED_HOSTS:-*.aliyuncs.com}
      TEXTBOOK_S3_KEY_PREFIX: ${TEXTBOOK_S3_KEY_PREFIX:-learning-materials/textbooks/}
      TEXTBOOK_MARKDOWN_ASSET_PUBLIC_BASE_PATH: ${TEXTBOOK_MARKDOWN_ASSET_PUBLIC_BASE_PATH:-/api/public/textbooks}
      TEXTBOOK_FILE_UPLOAD_MAX_BYTES: ${TEXTBOOK_FILE_UPLOAD_MAX_BYTES:-83886080}
      CMS_SCHEDULED_PUBLISHER_ENABLED: ${CMS_SCHEDULED_PUBLISHER_ENABLED:-1}
      CMS_SCHEDULED_PUBLISHER_INTERVAL_MS: ${CMS_SCHEDULED_PUBLISHER_INTERVAL_MS:-60000}
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./deploy/data/logs/api-core:/app/logs
      - ./deploy/data/uploads:/app/uploads
    depends_on:
      runtime-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3322/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  ai-gateway:
    image: ${AI_GATEWAY_IMAGE:-xueleai-ai-gateway:0.0.0}
    build:
      context: .
      dockerfile: apps/ai-gateway/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3323/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-xueleai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-xueleai}
    command: ["postgres", "-p", "3327"]
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-3327}:3327"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p 3327"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--appendonly", "yes", "--port", "3328"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "3328", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-xueleai-prod_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-xueleai-prod_redis_data}
