upstream xueleai_web {
  server web:3321;
}

upstream xueleai_api_core {
  server api-core:3322;
}

upstream xueleai_ai_gateway {
  server ai-gateway:3323;
}

server {
  listen 3320 default_server;
  server_name _;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 444;
  }
}

server {
  listen 3320;
  server_name xueleai.com;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://xueleai.com$request_uri;
  }
}

server {
  listen 3320;
  server_name www.xueleai.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://xueleai.com$request_uri;
  }
}
