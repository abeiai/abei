limit_req_zone $binary_remote_addr zone=abei_creator:10m rate=10r/s;

server {
  listen 3600;
  server_name abeiai.com new.abeiai.com;
  location = /healthz { return 200 "ok\n"; }
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://abeiai.com$request_uri; }
}

server {
  listen 3610 ssl;
  server_name abeiai.com new.abeiai.com;
  ssl_certificate /etc/letsencrypt/live/new.abeiai.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/new.abeiai.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Only processes sharing this container's network namespace may probe readiness.
  # Client-supplied forwarding headers cannot bypass maintenance.
  set $abei_maintenance 0;
  if (-f /var/www/state/maintenance.enabled) { set $abei_maintenance 1; }
  if ($remote_addr = 127.0.0.1) { set $abei_maintenance 0; }
  if ($abei_maintenance) { return 503; }
  client_max_body_size 500m;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/hanzi/strokes {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location = /api/ai/image/student-photo/download {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/auth/wechat/mp/ {
    access_log off;
    client_max_body_size 64k;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  location = /callback/mp {
    access_log off;
    client_max_body_size 64k;
    proxy_cache off;
    proxy_pass http://api-core:3602/api/auth/wechat/mp/events;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  location ^~ /api/admin/legacy-ai-logs {
    access_log off;
    error_log /dev/null crit;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Account consent and capabilities must never appear in access logs.
  location ^~ /api/creator-auth/ {
    access_log off;
    error_log /dev/null crit;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(creator|account/connections)(/|$) {
    if ($host = new.abeiai.com) { return 308 https://abeiai.com$request_uri; }
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "private, no-store" always;
    proxy_cache off;
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(private-data|private-creator-assets|creator-assets)(/|$) { return 404; }

  location /api/ {
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location ^~ /ai-api/ { return 404; }

  location /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
  }

  location / {
    if ($host = new.abeiai.com) { return 308 https://abeiai.com$request_uri; }
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}

# Only this vhost exposes the delegated protocol; the account UI stays on the main site.
server {
  listen 3600;
  server_name mcp.abeiai.com;
  access_log off;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://mcp.abeiai.com$request_uri; }
}

server {
  listen 3610 ssl;
  server_name mcp.abeiai.com;
  ssl_certificate /etc/letsencrypt/live/mcp.abeiai.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mcp.abeiai.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off;
  # Error logs can include request arguments, so disable per-request error details here.
  error_log /dev/null crit;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control "private, no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  # Only processes sharing this container's network namespace may probe readiness.
  # Client-supplied forwarding headers cannot bypass maintenance.
  set $abei_maintenance 0;
  if (-f /var/www/state/maintenance.enabled) { set $abei_maintenance 1; }
  if ($remote_addr = 127.0.0.1) { set $abei_maintenance 0; }
  if ($abei_maintenance) { return 503; }
  client_max_body_size 2m;
  client_body_timeout 30s;
  limit_req zone=abei_creator burst=60 nodelay;
  limit_req_status 429;
  proxy_cache off;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_connect_timeout 5s;
  proxy_read_timeout 90s;
  proxy_send_timeout 90s;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /mcp { proxy_pass http://api-core:3602/api/creator-mcp; }
  location = /.well-known/oauth-authorization-server { proxy_pass http://api-core:3602/api/creator-auth/metadata; }
  location = /.well-known/oauth-protected-resource { proxy_pass http://api-core:3602/api/creator-auth/resource-metadata?resource=mcp; }
  location = /.well-known/oauth-protected-resource/mcp { proxy_pass http://api-core:3602/api/creator-auth/resource-metadata?resource=mcp; }
  location = /.well-known/oauth-protected-resource/api/creator/v1 { proxy_pass http://api-core:3602/api/creator-auth/resource-metadata?resource=api; }
  location = /oauth/authorize { client_max_body_size 64k; proxy_pass http://api-core:3602/api/creator-auth/oauth/authorize; }
  location = /oauth/register { client_max_body_size 64k; proxy_pass http://api-core:3602/api/creator-auth/oauth/register; }
  location = /oauth/device { client_max_body_size 64k; proxy_pass http://api-core:3602/api/creator-auth/oauth/device; }
  location = /oauth/token { client_max_body_size 64k; proxy_pass http://api-core:3602/api/creator-auth/oauth/token; }
  location = /oauth/revoke { client_max_body_size 64k; proxy_pass http://api-core:3602/api/creator-auth/oauth/revoke; }
  location ~ ^/api/creator/v1/(capabilities|account|books|albums|assets)$ { proxy_pass http://api-core:3602; }
  location ~ ^/api/creator/v1/(books|albums)/[A-Za-z0-9_-]+(/(validate|submit))?$ { proxy_pass http://api-core:3602; }
  location ~ ^/api/creator/v1/assets/[A-Za-z0-9_-]+(/(chunks|complete|data))?$ { proxy_pass http://api-core:3602; }
  location / { return 404; }
}
