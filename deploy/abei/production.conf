server {
  listen 3600;
  server_name new.abeiai.com;
  location = /healthz { return 200 "ok\n"; }
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://new.abeiai.com$request_uri; }
}

server {
  listen 3610 ssl;
  server_name new.abeiai.com;
  ssl_certificate /etc/letsencrypt/live/new.abeiai.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/new.abeiai.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  if (-f /var/www/state/maintenance.enabled) { return 503; }
  client_max_body_size 500m;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/hanzi/strokes {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location = /api/ai/image/student-photo/download {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/auth/wechat/mp/ {
    access_log off;
    client_max_body_size 64k;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  location ^~ /api/admin/legacy-ai-logs {
    access_log off;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location ^~ /ai-api/ { return 404; }

  location /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
  }

  location / {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
