server {
  listen 3600;
  server_name _;
  client_max_body_size 500m;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Classify the raw target before Nginx normalizes dot-segments in location matching.
  # A named error-page location preserves the original method, URI and body.
  error_page 418 = @abei_common_proxy;
  if ($request_uri ~ "^/open/v5/common(?:/|[?]|$)") { return 418; }

  location @abei_common_proxy {
    resolver 127.0.0.11 valid=60s ipv6=off;
    proxy_pass https://long-api.abeiai.com$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host long-api.abeiai.com;
    proxy_set_header Connection "";
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_ssl_server_name on;
    proxy_ssl_name long-api.abeiai.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;
  }

  location = /api/hanzi/strokes {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location = /api/ai/image/student-photo/download {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/auth/wechat/mp/ {
    access_log off;
    client_max_body_size 64k;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  location = /callback/mp {
    access_log off;
    client_max_body_size 64k;
    proxy_cache off;
    proxy_pass http://api-core:3602/api/auth/wechat/mp/events;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  location ^~ /api/admin/legacy-ai-logs {
    access_log off;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location /ai-api/ {
    rewrite ^/ai-api/(.*)$ /$1 break;
    proxy_pass http://ai-gateway:3603;
    proxy_set_header Host $http_host;
    proxy_read_timeout 720s;
  }

  location /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
  }

  location / {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
