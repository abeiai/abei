server {
  listen 3600;
  server_name _;
  client_max_body_size 500m;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/hanzi/strokes {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location = /api/ai/image/student-photo/download {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/auth/wechat/mp/ {
    access_log off;
    client_max_body_size 64k;
    proxy_cache off;
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  location /api/ {
    proxy_pass http://api-core:3602;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 720s;
  }

  location /ai-api/ {
    rewrite ^/ai-api/(.*)$ /$1 break;
    proxy_pass http://ai-gateway:3603;
    proxy_set_header Host $http_host;
    proxy_read_timeout 720s;
  }

  location /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
  }

  location / {
    proxy_pass http://web:3601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
